name: Build VST3 & AU - All Platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        working-directory: .
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DGITHUB_BUILD_NUMBER=${{ github.run_number }}

      - name: Build
        working-directory: .
        run: cmake --build build --config Release

      - name: Archive Windows builds
        shell: pwsh
        run: |
          Compress-Archive -Path build/ObsidianNeuralVST_artefacts/Release/VST3/* `
            -DestinationPath OBSIDIAN-Neural-Windows-VST3.zip
          Compress-Archive -Path build/ObsidianNeuralVST_artefacts/Release/Standalone/* `
            -DestinationPath OBSIDIAN-Neural-Windows-Standalone.zip

      - name: Upload Windows archives
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ObsidianNeural-Windows-Archives
          path: |
            OBSIDIAN-Neural-Windows-VST3.zip
            OBSIDIAN-Neural-Windows-Standalone.zip

  build-macos-universal:
    name: Build macOS Universal (VST3 + AU)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure CMake
        working-directory: .
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15" \
            -DGITHUB_BUILD_NUMBER=${{ github.run_number }}

      - name: Build
        working-directory: .
        run: cmake --build build --config Release

      - name: Verify build
        run: |
          echo "=== VST3 Build ==="
          lipo -info build/ObsidianNeuralVST_artefacts/Release/VST3/OBSIDIAN-Neural.vst3/Contents/MacOS/OBSIDIAN-Neural

          echo ""
          echo "=== AU Build ==="
          lipo -info build/ObsidianNeuralVST_artefacts/Release/AU/OBSIDIAN-Neural.component/Contents/MacOS/OBSIDIAN-Neural

      - name: Fix macOS permissions
        run: |
          chmod +x build/ObsidianNeuralVST_artefacts/Release/VST3/OBSIDIAN-Neural.vst3/Contents/MacOS/*
          chmod +x build/ObsidianNeuralVST_artefacts/Release/AU/OBSIDIAN-Neural.component/Contents/MacOS/*
          chmod +x build/ObsidianNeuralVST_artefacts/Release/Standalone/OBSIDIAN-Neural.app/Contents/MacOS/*

      - name: Import Code Signing Certificate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm certificate.p12

      - name: Sign VST3 & AU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Sign VST3
          codesign --force --sign "Developer ID Application: anthony charretier ($APPLE_TEAM_ID)" \
            --timestamp --options runtime --deep \
            build/ObsidianNeuralVST_artefacts/Release/VST3/OBSIDIAN-Neural.vst3

          # Sign AU
          codesign --force --sign "Developer ID Application: anthony charretier ($APPLE_TEAM_ID)" \
            --timestamp --options runtime --deep \
            build/ObsidianNeuralVST_artefacts/Release/AU/OBSIDIAN-Neural.component

          # Sign Standalone
          codesign --force --sign "Developer ID Application: anthony charretier ($APPLE_TEAM_ID)" \
             --timestamp --options runtime --deep \
             build/ObsidianNeuralVST_artefacts/Release/Standalone/OBSIDIAN-Neural.app

      - name: Verify signatures
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "=== VST3 Signature ==="
          codesign --verify --verbose build/ObsidianNeuralVST_artefacts/Release/VST3/OBSIDIAN-Neural.vst3

          echo ""
          echo "=== AU Signature ==="
          codesign --verify --verbose build/ObsidianNeuralVST_artefacts/Release/AU/OBSIDIAN-Neural.component

          echo ""
          echo "=== Standalone Signature ==="
          codesign --verify --verbose build/ObsidianNeuralVST_artefacts/Release/Standalone/OBSIDIAN-Neural.app

      - name: Create ZIPs for notarization
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # VST3
          ditto -c -k --keepParent \
            build/ObsidianNeuralVST_artefacts/Release/VST3/OBSIDIAN-Neural.vst3 \
            OBSIDIAN-Neural-VST3.zip

          # AU
          ditto -c -k --keepParent \
            build/ObsidianNeuralVST_artefacts/Release/AU/OBSIDIAN-Neural.component \
            OBSIDIAN-Neural-AU.zip

          # Standalone
          ditto -c -k --keepParent \
            build/ObsidianNeuralVST_artefacts/Release/Standalone/OBSIDIAN-Neural.app \
            OBSIDIAN-Neural-Standalone.zip

      - name: Notarize VST3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit OBSIDIAN-Neural-VST3.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Notarize AU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit OBSIDIAN-Neural-AU.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Notarize Standalone
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit OBSIDIAN-Neural-Standalone.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple VST3 & AU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          xcrun stapler staple build/ObsidianNeuralVST_artefacts/Release/VST3/OBSIDIAN-Neural.vst3
          xcrun stapler staple build/ObsidianNeuralVST_artefacts/Release/AU/OBSIDIAN-Neural.component
          xcrun stapler staple build/ObsidianNeuralVST_artefacts/Release/Standalone/OBSIDIAN-Neural.app

      - name: Re-zip after stapling
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -f OBSIDIAN-Neural-VST3.zip OBSIDIAN-Neural-AU.zip OBSIDIAN-Neural-Standalone.zip
          ditto -c -k --keepParent \
            build/ObsidianNeuralVST_artefacts/Release/VST3/OBSIDIAN-Neural.vst3 \
            OBSIDIAN-Neural-macOS-VST3.zip
          ditto -c -k --keepParent \
            build/ObsidianNeuralVST_artefacts/Release/AU/OBSIDIAN-Neural.component \
            OBSIDIAN-Neural-macOS-AU.zip
          ditto -c -k --keepParent \
            build/ObsidianNeuralVST_artefacts/Release/Standalone/OBSIDIAN-Neural.app \
            OBSIDIAN-Neural-macOS-Standalone.zip

      - name: Upload macOS archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ObsidianNeural-macOS-Archives
          path: |
            OBSIDIAN-Neural-macOS-VST3.zip
            OBSIDIAN-Neural-macOS-AU.zip
            OBSIDIAN-Neural-macOS-Standalone.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcomposite-dev \
            libxinerama-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev

      - name: Configure CMake
        working-directory: .
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGITHUB_BUILD_NUMBER=${{ github.run_number }}

      - name: Build
        working-directory: .
        run: cmake --build build --config Release

      - name: Archive Linux builds
        run: |
          tar -czf OBSIDIAN-Neural-Linux-VST3.tar.gz \
            -C build/ObsidianNeuralVST_artefacts/Release/VST3 .
          tar -czf OBSIDIAN-Neural-Linux-Standalone.tar.gz \
            -C build/ObsidianNeuralVST_artefacts/Release/Standalone .

      - name: Upload Linux archives
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ObsidianNeural-Linux-Archives
          path: |
            OBSIDIAN-Neural-Linux-VST3.tar.gz
            OBSIDIAN-Neural-Linux-Standalone.tar.gz

  create-release:
    needs: [build-windows, build-macos-universal, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: "OBSIDIAN-Neural v${{ github.run_number }}"
          body: |
            # 🎵 OBSIDIAN-Neural Release v${{ github.run_number }}

            Real-time AI music generation for your DAW - or Standalone.

            ## 📥 Installation

            All builds use the Cloud API. Get your API key at [obsidian-neural.com](https://obsidian-neural.com).

            ### **Windows**

            **Plugin (VST3)**
            1. Download `OBSIDIAN-Neural-Windows-VST3.zip`
            2. Extract to `C:\Program Files\Common Files\VST3\`
            3. Load in your DAW

            **Standalone**
            1. Download `OBSIDIAN-Neural-Windows-Standalone.zip`
            2. Extract anywhere and run `OBSIDIAN-Neural.exe`

            ### **macOS** (10.15 Catalina → 15.0 Sequoia)

            **VST3 (Ableton, Bitwig, FL Studio, Reaper)**
            1. Download `OBSIDIAN-Neural-macOS-VST3.zip`
            2. Extract and double-click `OBSIDIAN-Neural.vst3`, or copy to `~/Library/Audio/Plug-Ins/VST3/`

            **AU (Logic Pro, GarageBand)**
            1. Download `OBSIDIAN-Neural-macOS-AU.zip`
            2. Extract and double-click `OBSIDIAN-Neural.component`, or copy to `~/Library/Audio/Plug-Ins/Components/`

            💡 Logic Pro users: use the AU version for best compatibility.

            **Standalone**
            1. Download `OBSIDIAN-Neural-macOS-Standalone.zip`
            2. Extract and drag `OBSIDIAN-Neural.app` to your Applications folder

            ### **Linux**

            **Plugin (VST3)**
            1. Download `OBSIDIAN-Neural-Linux-VST3.tar.gz`
            2. Extract to `~/.vst3/`
            3. Load in your DAW

            **Standalone**
            1. Download `OBSIDIAN-Neural-Linux-Standalone.tar.gz`
            2. Extract anywhere and run the binary

            ---

            ## 📚 Resources

            - 🌐 [obsidian-neural.com](https://obsidian-neural.com) - Get your API key
            - 🎓 [Video Tutorial](https://www.youtube.com/watch?v=l4KMC5adxVA)
            - 💬 [Discussions](https://github.com/innermost47/ai-dj/discussions)
            - 🐛 [Issues](https://github.com/innermost47/ai-dj/issues)

            ---

            ⭐ Star the repo if you find OBSIDIAN-Neural useful!

          files: |
            OBSIDIAN-Neural-macOS-VST3.zip
            OBSIDIAN-Neural-macOS-AU.zip
            OBSIDIAN-Neural-macOS-Standalone.zip
            OBSIDIAN-Neural-Linux-VST3.tar.gz
            OBSIDIAN-Neural-Linux-Standalone.tar.gz
            OBSIDIAN-Neural-Windows-VST3.zip
            OBSIDIAN-Neural-Windows-Standalone.zip
