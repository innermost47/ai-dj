name: Build & Package Installers - All Platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          $ts = (Get-Date -AsUTC).ToString("yyyy-MM-ddTHH:mm:ss")
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGITHUB_BUILD_NUMBER=${{ github.run_number }} -DGITHUB_BUILD_TIMESTAMP="$ts"

      - name: Build
        run: cmake --build build --config Release

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Package installer (NSIS)
        run: cpack --config build/CPackConfig.cmake -G NSIS -C Release

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ObsidianNeural-Windows-Installer
          path: "OBSIDIAN-Neural-*.exe"

  build-macos:
    name: Build macOS (arm64 - VST3 + AU + Standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Create entitlements file
        run: |
          cat > /tmp/obsidian_entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.cs.allow-dyld-environment-variables</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Import Code Signing Certificates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain"

          echo "$MACOS_CERTIFICATE" | base64 --decode > app_certificate.p12
          echo "$MACOS_INSTALLER_CERTIFICATE" | base64 --decode > installer_certificate.p12

          echo "=== Création du trousseau dédié build.keychain ==="
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"

          security import app_certificate.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" -A -T /usr/bin/codesign
          security import installer_certificate.p12 -k "$KEYCHAIN" -P "$MACOS_INSTALLER_CERTIFICATE_PWD" -A -T /usr/bin/productbuild -T /usr/bin/productsign

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

          rm app_certificate.p12 installer_certificate.p12

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DGITHUB_BUILD_NUMBER=${{ github.run_number }} \
            -DGITHUB_BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S")

      - name: Build
        run: cmake --build build --config Release

      - name: Verify build
        run: |
          echo "=== VST3 ==="
          lipo -info build/ObsidianNeuralVST_artefacts/Release/VST3/OBSIDIAN-Neural.vst3/Contents/MacOS/OBSIDIAN-Neural
          echo "=== AU ==="
          lipo -info build/ObsidianNeuralVST_artefacts/Release/AU/OBSIDIAN-Neural.component/Contents/MacOS/OBSIDIAN-Neural
          echo "=== Standalone ==="
          lipo -info build/ObsidianNeuralVST_artefacts/Release/Standalone/OBSIDIAN-Neural.app/Contents/MacOS/OBSIDIAN-Neural

      - name: Fix macOS permissions
        run: |
          chmod +x build/ObsidianNeuralVST_artefacts/Release/VST3/OBSIDIAN-Neural.vst3/Contents/MacOS/*
          chmod +x build/ObsidianNeuralVST_artefacts/Release/AU/OBSIDIAN-Neural.component/Contents/MacOS/*
          chmod +x build/ObsidianNeuralVST_artefacts/Release/Standalone/OBSIDIAN-Neural.app/Contents/MacOS/*

      - name: CPack staging (productbuild components)
        run: cpack --config build/CPackConfig.cmake -G productbuild -C Release -D CPACK_SET_DESTDIR=ON

      - name: Sign components (inside-out)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGNING_NAME: ${{ secrets.MACOS_SIGNING_NAME }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain"
          ENTITLEMENTS="/tmp/obsidian_entitlements.plist"
          CODE_SIGN_ID="Developer ID Application: $MACOS_SIGNING_NAME ($APPLE_TEAM_ID)"

          STAGING=$(find _CPack_Packages/Darwin/productbuild -maxdepth 1 -type d -name "OBSIDIAN-Neural-*-Darwin" | head -n 1)
          echo "=== Dossier Staging configuré : $STAGING ==="

          sign_runtime() {
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            codesign --force --sign "$CODE_SIGN_ID" --keychain "$KEYCHAIN" \
              --timestamp --options runtime --entitlements "$ENTITLEMENTS" "$1"
          }

          echo "=== Signature des composants (Code Signing) ==="

          echo "-> Signature des dylibs ONNX (imbriqués)..."
          find "$STAGING" -name "libonnxruntime*.dylib" | while read -r dylib; do
            echo "   dylib : $dylib"
            sign_runtime "$dylib"
          done

          echo "-> Signature des VST3..."
          find "$STAGING" -name "OBSIDIAN-Neural.vst3" | while read -r vst3; do
            echo "   vst3 : $vst3"
            sign_runtime "$vst3"
          done

          echo "-> Signature des Audio Units..."
          find "$STAGING" -name "OBSIDIAN-Neural.component" | while read -r au; do
            echo "   au : $au"
            sign_runtime "$au"
          done

          echo "-> Signature des applications Standalone..."
          find "$STAGING" -name "OBSIDIAN-Neural.app" | while read -r app; do
            echo "   app : $app"
            sign_runtime "$app"
          done

          echo "=== Fin de la signature granulaire ==="

      - name: Verify signatures
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          STAGING=$(find _CPack_Packages/Darwin/productbuild -maxdepth 1 -type d -name "OBSIDIAN-Neural-*-Darwin" | head -n 1)
          codesign --verify --deep --strict --verbose=2 \
            "$STAGING/vst3/usr/local/Library/Audio/Plug-Ins/VST3/OBSIDIAN-Neural.vst3"
          APP_STAGED="$STAGING/standalone/usr/local/Applications/OBSIDIAN-Neural.app"
          codesign --verify --deep --strict --verbose=2 "$APP_STAGED"
          echo "-> rpath et dépendance ONNX du binaire standalone :"
          otool -L "$APP_STAGED/Contents/MacOS/OBSIDIAN-Neural" | grep onnx || true
          otool -l "$APP_STAGED/Contents/MacOS/OBSIDIAN-Neural" | grep -A2 LC_RPATH || true
          ls -l "$APP_STAGED/Contents/Frameworks/" || true

      - name: Build & sign final pkg
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGNING_NAME: ${{ secrets.MACOS_SIGNING_NAME }}
        run: |
          STAGING=$(find _CPack_Packages/Darwin/productbuild -maxdepth 1 -type d -name "OBSIDIAN-Neural-*-Darwin" | head -n 1)
          VERSION=$(echo "$STAGING" | sed -E 's/.*OBSIDIAN-Neural-(.*)-Darwin/\1/')
          INSTALLER_SIGN_ID="Developer ID Installer: $MACOS_SIGNING_NAME ($APPLE_TEAM_ID)"

          mkdir -p installer /tmp/obsidian_pkgs
          rm -f /tmp/obsidian_pkgs/*.pkg installer/*.pkg

          pkgbuild --root "$STAGING/vst3/usr/local/Library/Audio/Plug-Ins/VST3/OBSIDIAN-Neural.vst3" \
            --identifier "com.innermost47.obsidian-neural.vst3" \
            --version "$VERSION" --install-location "/Library/Audio/Plug-Ins/VST3/OBSIDIAN-Neural.vst3" \
            /tmp/obsidian_pkgs/vst3.pkg

          pkgbuild --root "$STAGING/au/usr/local/Library/Audio/Plug-Ins/Components/OBSIDIAN-Neural.component" \
            --identifier "com.innermost47.obsidian-neural.au" \
            --version "$VERSION" --install-location "/Library/Audio/Plug-Ins/Components/OBSIDIAN-Neural.component" \
            /tmp/obsidian_pkgs/au.pkg

          pkgbuild --root "$STAGING/standalone/usr/local/Applications/OBSIDIAN-Neural.app" \
            --identifier "com.innermost47.obsidian-neural.standalone" \
            --version "$VERSION" --install-location "/Applications/OBSIDIAN-Neural.app" \
            /tmp/obsidian_pkgs/standalone.pkg

          productbuild \
            --package /tmp/obsidian_pkgs/vst3.pkg \
            --package /tmp/obsidian_pkgs/au.pkg \
            --package /tmp/obsidian_pkgs/standalone.pkg \
            --sign "$INSTALLER_SIGN_ID" --timestamp \
            "installer/OBSIDIAN-Neural-${VERSION}-Darwin.pkg"

          echo "=== Payload check ==="
          ls -lh installer/*.pkg
          pkgutil --payload-files installer/*.pkg | head

      - name: Notarize & staple
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > notary_key.p8
          PKG=$(ls installer/*.pkg | head -n 1)
          xcrun notarytool submit "$PKG" \
            --key notary_key.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          rm notary_key.p8

      - name: Verify installer signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PKG=$(ls installer/*.pkg | head -n 1)
          pkgutil --check-signature "$PKG"
          spctl --assess --type install --verbose=2 "$PKG"

      - name: Upload macOS installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ObsidianNeural-macOS-Installer
          path: installer/*.pkg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxcomposite-dev \
            libxinerama-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DGITHUB_BUILD_NUMBER=${{ github.run_number }} -DGITHUB_BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S")

      - name: Build
        run: cmake --build build --config Release

      - name: Package installer (TGZ)
        run: cpack --config build/CPackConfig.cmake -G TGZ -C Release

      - name: Upload Linux package
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ObsidianNeural-Linux-Package
          path: "OBSIDIAN-Neural-*.tar.gz"

  create-release:
        needs: [build-windows, build-macos, build-linux]
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v5.0.0

            - name: Download all artifacts
              uses: actions/download-artifact@v4.3.0
              with:
                merge-multiple: true

            - name: Create Release
              uses: softprops/action-gh-release@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                tag_name: v${{ github.run_number }}
                name: "OBSIDIAN-Neural Local v${{ github.run_number }}"
                body: |
                  OBSIDIAN-Neural Local — build v${{ github.run_number }}

                Installers: Windows (.exe), macOS arm64 (.pkg), Linux (.tar.gz).
                files: |
                  *.exe
                  *.pkg
                  *.tar.gz
